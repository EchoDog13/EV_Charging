version: "3.9"
services:
  monitor:
    build: ./ev_cp_m
    image: ev_cp_m:latest
    ports:
      - "${MONITOR_HOST}:${MONITOR_HOST_PORT}:${MONITOR_HOST_PORT}" # monitor engine socket now maps to container port 5051
    command: "${MONITOR_COMMAND}"
    environment:
      - CHARGER_ID=${CHARGER_ID:-1000}
      - ENGINE_PORT=${MONITOR_HOST_PORT} 
      - CENTRAL_IP=${CENTRAL_IP}
      - CENTRAL_PORT=${CENTRAL_PORT}
      - MONITOR_HOST=100.123.78.116
      - CHARGER_LOCATION=${CHARGER_LOCATION:-Unknown Location}
    deploy:
      replicas: 1

  engine:
    build: ./ev_cp_e
    image: ev_engine:latest
    ports:
      - "${ENGINE_HOST}:${ENGINE_HOST_PORT}:8080" # engine REST API
    environment:
      - CHARGER_ID=${CHARGER_ID:-1000}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=100.83.66.30:9092
      - SPRING_APPLICATION_NAME=${CHARGER_ID}-GROUP
      - ENGINE_HOST=100.123.78.116
      - ENGINE_PORT=${MONITOR_HOST_PORT}
      - MONITOR_HOST_PORT=${MONITOR_HOST_PORT}
      - SPRING_KAFKA_CONSUMER_GROUP_ID=${CHARGER_ID}-GROUP

    command: >
      sh -c "
      echo 'Waiting for monitor to start...' &&
      sleep 7 &&
      java -Dcharger.id=$CHARGER_ID -jar app.jar
      "
    depends_on:
      - monitor
    deploy:
      replicas: 1