version: "3.9"
services:
  monitor:
    build: ./ev_cp_m
    image: ev_cp_m:latest
    ports:
      - "${MONITOR_HOST_PORT}:5051" # monitor engine socket now maps to container port 5051
    command: "${MONITOR_COMMAND}"
    environment:
      - CHARGER_ID=${CHARGER_ID:-1000}
      - ENGINE_PORT=5051 # engine will connect to monitor on port 5051
      - CENTRAL_IP=${CENTRAL_IP}
      - CENTRAL_PORT=${CENTRAL_PORT}
    deploy:
      replicas: 1

  engine:
    build: ./ev_cp_e
    image: ev_engine:latest
    ports:
      - "${ENGINE_HOST_PORT}:8080"
    environment:
      - CHARGER_ID=${CHARGER_ID:-1000}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BROKER}
      - SPRING_APPLICATION_NAME=CHARGER-SERVICE-GROUP
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://192.168.100.50:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_HOSTNAME=${CONTAINER_NAME}
      - EUREKA_INSTANCE_METADATA_CHARGER_ID=${CHARGER_ID:-1000}
      - ENGINE_HOST=monitor
      - ENGINE_PORT=5051

    command: >
      sh -c "
      echo 'Waiting for monitor to start...' &&
      sleep 7 &&
      java -Dcharger.id=$CHARGER_ID -jar app.jar
      "
    depends_on:
      - monitor
    deploy:
      replicas: 1