version: "3.9"

networks:
  alicante:
    external: true

services:
  monitor:
    build: ./ev_cp_m
    image: ev_cp_m:latest
    networks:
      alicante:
        ipv4_address: 192.168.100.30
    ports:
      - "5050:5050"   # optional; internal communication doesn't need this
    command: "${MONITOR_COMMAND}"
    deploy:
      replicas: 1

  engine:
    build: ./ev_cp_e
    image: ev_engine:latest
    networks:
      alicante:
        ipv4_address: 192.168.100.31
    environment:
      - MONITOR_HOST=monitor
      - MONITOR_PORT=5050
      - UID=${COMPOSE_PROJECT_NAME}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=192.168.100.10:9092
      # Local charger id for this engine instance. You MUST set CHARGER_ID in the environment
      # or an .env file when running docker-compose (no default provided to force explicit config).
      - CHARGER_ID=${CHARGER_ID}
    command: >
      sh -c "
      echo 'Waiting for monitor to start...' &&
      sleep 7 &&
      java -Dcharger.id=$CHARGER_ID -jar app.jar
      "
    depends_on:
      - monitor
    deploy:
      replicas: 1