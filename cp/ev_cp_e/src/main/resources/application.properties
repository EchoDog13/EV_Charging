spring:
  application:
    name: ${CHARGER_APP_NAME:cp${CHARGER_ID}}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:100.83.66.30:9092}

    # --- PRODUCER ---
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          com.kylebarker.dto.ChargingEvent:com.kylebarker.dto.ChargingEvent,
          com.kylebarker.dto.BroadcastMessage:com.kylebarker.dto.BroadcastMessage

    # --- CONSUMER ---
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:ev_central_group_${CHARGER_ID}}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # WRAP JsonDeserializer to survive bad messages
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        # Optional: fallback type if no header
        spring.json.value.default.type: com.kylebarker.dto.ChargingEvent

    listener:
      missing-topics-fatal: false
      concurrency: 1

# Local charger id
charger:
  id: ${CHARGER_ID}

# Disable discovery
spring.cloud.discovery.enabled: false
eureka.client.enabled: false