spring:
  application:
    name: ${CHARGER_APP_NAME:cp${CHARGER_ID}}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:100.83.66.30:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Remove type mapping to allow any Object/Map
# spring.kafka.producer.properties.spring.json.type.mapping=...

# Optional: Include type headers (set to false for raw JSON)
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Local charger id
charger:
  id: ${CHARGER_ID}

# Disable discovery
spring.cloud.discovery.enabled: false
eureka.client.enabled: false