spring:
  application:
    name: ${CHARGER_APP_NAME:cp${CHARGER_ID}}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:100.83.66.30:9092}

    # --- PRODUCER: Sends JSON with type info ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=com.kylebarker.dto.ChargingEvent:com.kylebarker.dto.ChargingEvent,com.kylebarker.dto.BroadcastMessage:com.kylebarker.dto.BroadcastMessage

# --- CONSUMER: Receives raw JSON as String (for listen(String)) ---
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ev_central_group_${CHARGER_ID}}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Use ErrorHandlingDeserializer + StringDeserializer → gives you raw JSON string
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

# Listener
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.concurrency=1
# Local charger id
charger:
  id: ${CHARGER_ID}

# Disable discovery
spring.cloud.discovery.enabled: false
eureka.client.enabled: false