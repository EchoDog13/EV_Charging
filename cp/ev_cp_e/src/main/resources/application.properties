spring.kafka.bootstrap-servers=100.83.66.30:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer should use deserializers (not serializers) when receiving messages as Strings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=ev_central_group

listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://100.83.66.30:29092

# server.port=${ENGINE_HOST_PORT:8081} 
spring.application.name=${CHARGER_APP_NAME:cp1000}

eureka.client.service-url.defaultZone=http://192.168.100.50:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Local charger id (required). Populated from the CHARGER_ID environment variable at runtime.
charger.id=${CHARGER_ID}