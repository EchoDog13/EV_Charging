spring.kafka.bootstrap-servers=192.168.100.10:9092
# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer config
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=ev_central_group

# Trust all packages for JsonDeserializer (required to deserialize arbitrary POJOs)
spring.kafka.consumer.properties.spring.json.trusted.packages=*

listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://192.168.100.10:9092

# server.port=${ENGINE_HOST_PORT:8081} 
spring.application.name=${CHARGER_APP_NAME:cp1000}



# Local charger id (required). Populated from the CHARGER_ID environment variable at runtime.
charger.id=${CHARGER_ID}

spring.cloud.discovery.enabled=false
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false