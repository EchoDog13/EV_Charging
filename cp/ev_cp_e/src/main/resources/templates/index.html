<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charging Engine Simulator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>Charging Point Engine</h1>
  <div class="muted">Simulate charging process for a specific CP</div>

  <section class="card">
    <div class="row">
      <label>CP UID:</label>
      <input id="cpUid" value="CP101"/>
      <span id="statusBadge" class="status unknown">—</span>
      <button id="btnLoad">Load Session</button>
      <!-- CP API base override: set base URL (including port) for this charger instance -->
      <label style="margin-left:12px; font-size:90%">API base:</label>
  <input id="cp-api-base" placeholder="9901 or http://localhost:9901" style="width:200px; margin-left:6px;" />
      <button id="cp-api-save">Save</button>
      <button id="cp-api-reset">Reset</button>
    </div>
    <pre id="output">—</pre>
  </section>

  <section class="card">
    <h2>Messages</h2>
    <div id="messages" class="messages">No messages yet.</div>
    <div class="row">
      <button id="btnClear">Clear</button>
    </div>
  </section>

  <section class="card">
    <!-- Charging controls and simulation removed (not used) -->

  <script src="/js/app.js"></script>
</body>
</html>
