<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charging Engine Simulator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>Charging Point Engine</h1>
  <div class="muted">Simulate charging process for a specific CP</div>

  <section class="card">
    <div class="row">
      <label>CP UID:</label>
      <input id="cpUid" value="1000"/>
      <span id="statusBadge" class="status unknown">—</span>
      <button id="btnLoad">Load Session</button>
    </div>
    <pre id="output">—</pre>
  </section>

  <section class="card">
    <h2>Messages</h2>
    <div id="messages" class="messages">No messages yet.</div>
    <div class="row">
      <button id="btnClear">Clear</button>
    </div>
  </section>

  <section class="card">
    <h2>Plug / Unplug</h2>
    <div class="row">
      <button id="btnPlug">Plug Vehicle</button>
      <button id="btnUnplug">Unplug Vehicle</button>
    </div>
    <div class="muted">Use Plug to start or resume a session; Unplug will end the current session</div>
  </section>

  <section class="card">
    <h2>Request Charging</h2>
    <div class="row">
      <label>Driver ID:</label>
      <input id="driverId" value="10" />
      <button id="btnRequestCharge">Request Charge</button>
    </div>
    <div class="muted">Sends a startCharging request to central for authorization.</div>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
