<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charging Engine Simulator</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>Charging Point Engine</h1>
  <div class="muted">Simulate charging process for a specific CP</div>

  <section class="card">
    <div class="row">
      <label>CP UID:</label>
      <input id="cpUid" value="CP101"/>
      <button id="btnLoad">Load Session</button>
    </div>
    <pre id="output">—</pre>
  </section>

  <section class="card">
    <h2>Charging Controls</h2>
    <div class="row">
      <button onclick="startSession()">Start Session</button>
      <button onclick="stopSession()">Stop Session</button>
      <button onclick="sendTelemetry()">Send Telemetry</button>
    </div>
  </section>

  <section class="card">
    <h2>Simulation</h2>
    <div class="row">
      <button onclick="simulate()">Start Auto Simulation</button>
      <button onclick="stopSim()">Stop Simulation</button>
    </div>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
