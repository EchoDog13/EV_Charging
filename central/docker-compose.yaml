services:
  # --------------------------------------------------------------------
  # Kafka Services
  # --------------------------------------------------------------------
 
  # --------------------------------------------------------------------
  # Application Services
  # --------------------------------------------------------------------
  ev_central:
    build: ./EV_Central
    container_name: ev-central
    ports:
      - "100.83.66.30:8081:8080"    # App API via Tailscale
      - "100.83.66.30:5500:5500"    # Debug port via Tailscale  
      - "100.83.66.30:9900:9900"    # Web port via Tailscale
    environment:
      # Connect to Kafka container internally
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Database connection
      DB_HOST: ev_db
      DB_PORT: 3306
      DB_NAME: ev_database
      DB_USER: ev_user
      DB_PASSWORD: ev_password


  # --------------------------------------------------------------------
  # Database & Admin Tool
  # --------------------------------------------------------------------
  ev_db:
    image: mysql:8
    container_name: ev-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ev_database
      MYSQL_USER: ev_user
      MYSQL_PASSWORD: ev_password
    ports:
      - "100.83.66.30:3307:3306"  # MySQL via Tailscale
    volumes:
      - ev_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ev-phpmyadmin
    ports:
      - "100.83.66.30:8060:80"  # PHPMyAdmin via Tailscale
    environment:
      PMA_HOST: ev_db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      ev_db:
        condition: service_healthy

volumes:
  ev_db_data: