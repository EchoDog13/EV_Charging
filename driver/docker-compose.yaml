version: "3.8"

services:
  ev-driver:
    build:
      context: ./EV_Driver
      dockerfile: dockerfile
    container_name: ev-driver
    image: ev_driver:latest
    networks:
      alicante: 
        ipv4_address: 192.168.100.103
    restart: unless-stopped

networks:
  alicante:
    external: true 