<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Console</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <h1>Driver Console</h1>

  <section class="card">
    <div class="row">
      <label>Driver ID</label>
      <input id="driverId" value="9001"/>
      <button id="btnLoadCps">Reload CPs</button>
    </div>
    <div class="row">
      <label>Choose CP</label>
      <select id="cpSelect"></select>
      <button id="btnRequest">Send Charge Request</button>
    </div>
  </section>

  <section class="card">
    <h2>Charging Session</h2>
    <button id="btnStopSession">Stop Session</button>
    
    <!-- Telemetry panel: always visible and updated only when telemetry matches this driver's id -->
    <div id="telemetry-panel" style="margin-top:12px;">
      <h3>Telemetry</h3>
      <div><strong>CP UID:</strong> <span id="t-cp">-</span></div>
      <div><strong>Session:</strong> <span id="t-session">-</span></div>
      <div><strong>Driver:</strong> <span id="t-driver">-</span></div>
      <div><strong>Energy (kWh):</strong> <span id="t-energy">-</span></div>
      <div><strong>Power (kW):</strong> <span id="t-power">-</span></div>
      <div><strong>Cost (€):</strong> <span id="t-cost">-</span></div>
      <div><strong>Last Telemetry:</strong> <span id="t-ts">-</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Simulation</h2>
    <div class="row">
      <label>File path (one CP UID per line)</label>
      <input id="simFile" placeholder="/path/to/requests.txt" style="flex:1"/>
      <button id="btnStartSim">Start</button>
      <button id="btnStopSim">Stop</button>
    </div>
    <pre id="simOut">—</pre>
  </section>

  <section class="card">
    <h2>Available Charging Points</h2>
    <table id="tbl">
      <thead>
        <tr><th>UID</th><th>Name</th><th>Location</th><th>€/kWh</th><th>State</th><th>Last seen</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
