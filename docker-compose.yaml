version: '3.8'

services:
  ev_central:
    build: ./EV_Central
    container_name: ev-central
    platform: linux/arm64  # Force ARM64 platform
    ports:
      - "8080:8080"     # Spring Boot Tomcat (web interface)
      - "5500:5500"     # Custom socket service
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5050"]
      interval: 5s
      retries: 12
      start_period: 5s
      timeout: 3s
    networks:
      - ev_net

  ev_cp:
    build: ./EV_CP
    container_name: ev-cp-service
    platform: linux/arm64  # Force ARM64 platform
    ports:
      - "30000:30000"
    environment:
      CENTRAL_HOST: ev_central
      CENTRAL_PORT: 5500
      DB_HOST: ev_db
      DB_PORT: 3306
      DB_NAME: ev_database
      DB_USER: ev_user
      DB_PASSWORD: ev_password
    depends_on:
      ev_central:
        condition: service_healthy
      ev_db:
        condition: service_started
    networks:
      - ev_net

  ev_db:
    image: mysql:8.1  # This version has ARM64 support
    container_name: ev-db
    platform: linux/arm64  # Force ARM64 platform
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ev_database
      MYSQL_USER: ev_user
      MYSQL_PASSWORD: ev_password
    ports:
      - "3309:3306"
    volumes:
      - ev_db_data:/var/lib/mysql
    networks:
      - ev_net

  phpmyadmin:
    image: phpmyadmin:latest  # Official image has ARM64 support
    container_name: ev-phpmyadmin
    platform: linux/arm64  # Force ARM64 platform
    environment:
      PMA_HOST: ev_db
      PMA_USER: ev_user
      PMA_PASSWORD: ev_password
    ports:
      - "8081:80"
    depends_on:
      - ev_db
    networks:
      - ev_net

networks:
  ev_net:
    driver: bridge

volumes:
  ev_db_data: